  - steam closets
  - commercial laundry
- id: water-heating-treatment
  title: Water Heating & Treatment
  description: Heating, filtration, softening, conditioning, and quality management of household water.
  examples:
  - water heaters
  - water filtration
  - water softeners
- id: dish-care
  title: Dish Care
  description: Cleaning, sanitizing, drying, loading, and care of dishes, cookware, glassware, and utensils.
  examples:
  - dishwashers
  - drying
  - sanitization
  - detergent dosing
- id: small-appliances
  title: Small Appliances
  description: Compact countertop, portable, and handheld appliance contexts where size, portability, storage, power, interaction, and countertop use materially shape the solution.
  examples:
  - coffee makers
  - blenders
  - immersion blenders
  - countertop ice makers
  - compact refrigerators
- id: recreational-living
  title: Recreational Living
  description: Mobile and temporary living architectures and infrastructure associated with RVs, trailers, camper vans, overlanding, camping, and similar vehicle-based living contexts.
  examples:
  - RVs
  - travel trailers
