  title: Waste Handling
  description: Collection, reduction, processing, and disposal of household food and solid waste.
  examples:
  - garbage disposals
  - trash compactors
- id: food-preparation
  title: Food Preparation
  description: Nonthermal preparation, mixing, blending, processing, and handling of food before or apart from cooking.
  examples:
  - stand mixers
  - blenders
  - immersion blenders
  - food processors
- id: beverage
  title: Beverage
  description: Preparation, dispensing, conditioning, and service of beverages.
  examples:
  - coffee makers
  - espresso machines
- id: clothing-care
  title: Clothing Care
  description: Washing, drying, refreshing, steaming, and other care of garments and textiles.
  examples:
  - washers
